name: Automatic delivery

on:
  push:
    branches: ['**']
  deployment_status:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write
  deployments: read

# Keep source branches separate so a burst of pushes does not drop PR enrollment.
# Expected head SHAs and fresh PR reads guard concurrent merges; the timer retries.
concurrency:
  group: automatic-delivery-${{ github.event_name == 'push' && github.ref || 'reconcile' }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: vars.AUTO_DELIVERY_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted controller only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Reconcile PRs and release gates
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          VERCEL_PREVIEW_ENVIRONMENT: ${{ vars.VERCEL_PREVIEW_ENVIRONMENT }}
        with:
          github-token: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          script: |
            const reconcile = require('./.github/scripts/automatic-delivery.cjs');
            await reconcile({ github, context, core });
